name: Build shuhao (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'shuhao_v*'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode / SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build iOS app (unsigned)
        run: |
          set -euo pipefail
          DERIVED="$PWD/build/ios-derived"
          xcodebuild -project shuhao.xcodeproj \
            -scheme shuhao \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || BUILD_RC=$?
          echo "=== xcodebuild exit: ${BUILD_RC:-0} ==="
          echo "=== error: lines ==="
          grep -nE "error:" build.log | head -120 || true
          echo "=== warning-as-error / availability notes ==="
          grep -nE "is only available in|requires .* to be available|marked unavailable" build.log | head -40 || true
          if [ "${BUILD_RC:-0}" -ne 0 ]; then
            echo "=== BUILD FAILED (rc=$BUILD_RC) ==="
            exit "$BUILD_RC"
          fi
          APP=$(find "$DERIVED/Build/Products/Release-iphoneos" -name "shuhao.app" -maxdepth 1 | head -1)
          echo "APP=$APP"
          [ -d "$APP" ] || { echo "iOS .app not found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r shuhao-unsigned.ipa Payload
          ls -lh shuhao-unsigned.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: shuhao-ios-ipa
          path: shuhao-unsigned.ipa

  release:
    name: Publish release (on tag)
    needs: [build-ios]
    if: startsWith(github.ref, 'refs/tags/shuhao_v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/shuhao-unsigned.ipa
